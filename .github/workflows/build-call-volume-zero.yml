name: Build Call Volume Zero APK

on:
  push:
    branches: [call-volume-zero]
    paths: ['call-volume-zero/**', '.github/workflows/build-call-volume-zero.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: call-volume-zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CallVolumeZero.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CallVolumeZero
          path: call-volume-zero/CallVolumeZero.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: call-volume-zero-latest
          name: Call Volume Zero (latest APK)
          files: call-volume-zero/CallVolumeZero.apk
