name: Build StorageManager APK

on:
  push:
    paths:
      - "StorageManager/**"
      - ".github/workflows/build-storage-manager.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StorageManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StorageManager-debug-apk
          path: StorageManager/app/build/outputs/apk/debug/*.apk
