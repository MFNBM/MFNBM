name: Build StorageManager APK

on:
  push:
    paths:
      - "StorageManager/**"
      - ".github/workflows/build-storage-manager.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StorageManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StorageManager-debug-apk
          path: StorageManager/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          cp StorageManager/app/build/outputs/apk/debug/app-debug.apk StorageManager-debug.apk
          TAG="storagemanager-build-${{ github.run_number }}"
          gh release create "$TAG" StorageManager-debug.apk \
            --title "StorageManager debug build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}. Download StorageManager-debug.apk and install it."
